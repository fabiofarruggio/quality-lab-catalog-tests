name: Verify catalog reference (manual preparation)
on:
  workflow_dispatch:
    inputs:
      app_repository:
        description: Authorized owner/quality-lab-app repository
        required: true
        type: string
      app_commit:
        description: Exact reviewed 40-character application commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate explicit app identity
        env:
          APP_REPOSITORY: ${{ inputs.app_repository }}
          APP_COMMIT: ${{ inputs.app_commit }}
        shell: bash
        run: |
          [[ "$APP_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/quality-lab-app$ ]] || exit 1
          [[ "$APP_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: quality-lab-catalog-tests
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_commit }}
          path: quality-lab-app
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: quality-lab-app
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: quality-lab-catalog-tests
      - run: npm run typecheck
        working-directory: quality-lab-catalog-tests
      - run: npm run test:api
        working-directory: quality-lab-catalog-tests
      - name: Preserve results, not a release gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-http-memory-test-double
          path: quality-lab-catalog-tests/test-results/results.json
          retention-days: 3
